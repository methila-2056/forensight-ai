# FORENSIGHT AI — frontend static host and API reverse proxy.
#
# Serves the built SPA and proxies /api to the backend service on the compose
# network, so the browser only ever talks to one origin.

upstream foresight_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evidence uploads are capped at MAX_UPLOAD_MB (25 MB) by the application.
    # Keep this slightly above it so an oversized upload is rejected by the app
    # with a useful message rather than silently cut off by nginx.
    client_max_body_size 32m;

    # Analysis, correlation and report generation are synchronous requests that
    # can take a while on large cases, so the proxy timeout is generous.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The frontend is built with content-hashed asset filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API traffic goes straight to the backend; never cached, never SPA-fallback.
    location /api/ {
        proxy_pass http://foresight_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_request_buffering off;
    }

    location = /docs    { proxy_pass http://foresight_backend; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://foresight_backend; proxy_set_header Host $host; }
    location = /redoc   { proxy_pass http://foresight_backend; proxy_set_header Host $host; }

    # Client-side routing: any unmatched path renders the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry document.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}